<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Clipz - Update in Arbeit</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        fortnite: {
                            purple: '#9146FF',
                            pink: '#F000FF',
                            cyan: '#00F0FF',
                            dark: '#0b0a10',
                            card: '#14121f',
                            hover: '#1e1b2e'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .font-fortnite { font-family: 'Teko', sans-serif; letter-spacing: 1px; }
        body { font-family: 'Inter', sans-serif; }
        .glow-effect { box-shadow: 0 0 50px -10px rgba(145, 70, 255, 0.25); }
    </style>
</head>
<body class="bg-fortnite-dark text-gray-100 min-h-screen flex flex-col justify-between selection:bg-fortnite-purple selection:text-white">

    <!-- Main Content: Zentrierte Wartungsmeldung ohne Header -->
    <main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
        <div class="relative max-w-xl w-full bg-fortnite-card rounded-3xl overflow-hidden border border-purple-900/40 p-8 md:p-10 glow-effect text-center">
            
            <div class="absolute -right-20 -top-20 w-64 h-64 bg-fortnite-purple/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -left-20 -bottom-20 w-64 h-64 bg-fortnite-cyan/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-10">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-fortnite-dark border border-purple-900/40 text-fortnite-cyan text-xl mb-6">
                    ⏳
                </div>

                <h1 class="font-fortnite text-3xl md:text-4xl font-bold text-white tracking-wide mb-2">
                    SYSTEM-AKTUALISIERUNG
                </h1>
                
                <span id="app-version" class="inline-block bg-fortnite-purple/20 border border-fortnite-purple/40 text-fortnite-cyan text-xs font-bold px-3 py-1 rounded-full mb-6">
                    V1.1
                </span>

                <p class="text-gray-400 text-sm md:text-base leading-relaxed mb-8">
                    Die Plattform wird derzeit überarbeitet. Der Zugriff ist bis zum Abschluss der Wartungsarbeiten vorübergehend nicht möglich.
                </p>

                <!-- Live Countdown Timer -->
                <div class="grid grid-cols-4 gap-2 mb-8 bg-fortnite-dark/60 border border-purple-900/30 p-4 rounded-2xl">
                    <div class="flex flex-col items-center">
                        <span id="days" class="text-2xl md:text-3xl font-bold text-white font-fortnite">00</span>
                        <span class="text-[10px] text-gray-500 uppercase tracking-wider">Tage</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <span id="hours" class="text-2xl md:text-3xl font-bold text-white font-fortnite">00</span>
                        <span class="text-[10px] text-gray-500 uppercase tracking-wider">Std</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <span id="minutes" class="text-2xl md:text-3xl font-bold text-white font-fortnite">00</span>
                        <span class="text-[10px] text-gray-500 uppercase tracking-wider">Min</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <span id="seconds" class="text-2xl md:text-3xl font-bold text-fortnite-cyan font-fortnite">00</span>
                        <span class="text-[10px] text-gray-500 uppercase tracking-wider">Sek</span>
                    </div>
                </div>

                <!-- Nur Button: Seite verlassen -->
                <div class="flex justify-center">
                    <a href="about:blank" class="w-full sm:w-auto px-8 py-3 rounded-2xl bg-gradient-to-r from-fortnite-purple via-fortnite-pink to-fortnite-cyan text-white text-sm font-semibold shadow-lg shadow-fortnite-purple/30 hover:opacity-95 transition-opacity text-center">
                        Seite verlassen
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-purple-900/20 bg-fortnite-dark py-6">
        <div class="max-w-7xl mx-auto px-4 text-xs text-gray-500 grid grid-cols-1 sm:grid-cols-3 items-center gap-4">
            <div class="text-center sm:text-left font-mono text-fortnite-cyan/80">
                <span id="footer-version">V1.1</span>
            </div>
            <div class="text-center font-medium">
                &copy; 2026 Fortnite Picz – Alle Rechte vorbehalten.
            </div>
            <div class="flex justify-center sm:justify-end gap-4">
                <span class="text-gray-600">Wartungsarbeiten aktiv</span>
            </div>
        </div>
    </footer>

    <!-- Skripte für Version & Countdown -->
    <script>
        // Ziel-Datum: 2. November 2026 um 00:00 Uhr
        const targetDate = new Date("2026-11-02T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("days").textContent = "00";
                document.getElementById("hours").textContent = "00";
                document.getElementById("minutes").textContent = "00";
                document.getElementById("seconds").textContent = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").textContent = String(days).padStart(2, '0');
            document.getElementById("hours").textContent = String(hours).padStart(2, '0');
            document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
            document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Version aus data.json laden
        async function loadVersion() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                if (data.version) {
                    document.getElementById('app-version').textContent = data.version;
                    document.getElementById('footer-version').textContent = data.version;
                }
            } catch (error) {
                console.log("Nutze Standard-Version.");
            }
        }
        loadVersion();
    </script>

</body>
</html>
