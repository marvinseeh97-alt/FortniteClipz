<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wartungsseite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0713;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* Textstyling im Design-Stil */
        .maintenance-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .maintenance-title .highlight-purple {
            color: #a855f7;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
        }

        .maintenance-title .highlight-blue {
            color: #00f0ff;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
        }

        /* Ladekreis zentriert darunter */
        .loader {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsives Design für kleinere Bildschirme */
        @media (max-width: 768px) {
            .maintenance-title {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <h2 class="maintenance-title">
        Wir arbeiten gerade <br>an der <span class="highlight-purple">Seite</span><span class="highlight-blue">...</span>
    </h2>
    
    <!-- Der kleine Ladekreis -->
    <div class="loader"></div>

</body>
</html>
